<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">My Blog</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="create-blog.html">Create Blog</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="padding: 20px;">
        <h2>All Blogs</h2>
        <!-- Blogs yahan par nazar aayenge -->
        <div id="blogs-container"></div>
    </div>

    <script>
        // Page load hote hi yeh function chalega
        async function fetchBlogs() {
            try {
                // Backend se blogs mangwana
                const response = await fetch('/blogs');
                const blogs = await response.json();

                const container = document.getElementById('blogs-container');
                container.innerHTML = ''; // Pehle se agar kuch hai toh saaf kar do

                if (blogs.length === 0) {
                    container.innerHTML = '<p>Abhi tak koi blog nahi likha gaya.</p>';
                    return;
                }

                // Har blog ke liye ek box banana
                blogs.forEach(blog => {
                    const blogBox = document.createElement('div');
                    blogBox.style.border = '1px solid #ccc';
                    blogBox.style.padding = '15px';
                    blogBox.style.marginBottom = '15px';
                    blogBox.style.borderRadius = '5px';

                    blogBox.innerHTML = `
                        <h3>${blog.title}</h3>
                        <p>${blog.description.substring(0, 50)}...</p>
                        
                        <!-- Read More Button -->
                        <a href="blog-detail.html?id=${blog._id}" style="display: inline-block; margin-top: 10px; color: white; background: #3498db; padding: 5px 10px; text-decoration: none; border-radius: 3px;">Read More</a>
                        
                        <!-- Edit Button -->
                        <a href="edit-blog.html?id=${blog._id}" style="display: inline-block; margin-top: 10px; margin-left: 10px; color: white; background: #f39c12; padding: 5px 10px; text-decoration: none; border-radius: 3px;">Edit</a>

                        <!-- Delete Button -->
                        <button onclick="deleteBlog('${blog._id}')" style="display: inline-block; margin-top: 10px; margin-left: 10px; color: white; background: #e74c3c; padding: 6px 10px; border: none; border-radius: 3px; cursor: pointer;">Delete</button>
                    `;

                    container.appendChild(blogBox);
                });
            } catch (error) {
                console.error("Blogs load nahi ho sake:", error);
            }
        }

        // Function ko call karna
        fetchBlogs();

        // Blog Delete karne ka function
        async function deleteBlog(id) {
            const confirmDelete = confirm("Kya aap waqai is blog ko delete karna chahte hain?");
            if (confirmDelete) {
                try {
                    const response = await fetch(`/blog/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    alert(data.message);
                    fetchBlogs(); // Yeh page refresh kiye bina list ko update kar dega
                } catch (error) {
                    alert("Delete karne mein error aa gaya!");
                }
            }
        }
    </script>
</body>

</html>
