<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">My Blog</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create an Account</h2>
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn">Register</button>
        </form>
        <p style="margin-top: 15px;">Already have an account? <a href="login.html"
                style="color: #3498db; text-decoration: none;">Login here</a></p>
    </div>

    <!-- Yeh JavaScript Backend se baat karegi -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault(); // Page ko reload hone se rokega

            // Form se user ka data nikalna
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Backend API ko POST request bhejna
            const response = await fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, email, password})
            });

            const data = await response.json();
            alert(data.message); // Screen par message dikhayega

            // Agar register ho gaya, toh Login page par le jao
            if (response.ok) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
