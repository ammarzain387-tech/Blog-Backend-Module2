<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">My Blog Dashboard</h2>
        <ul class="nav-links">
            <li><a href="create-blog.html">Create Blog</a></li>
            <li><a href="login.html" onclick="localStorage.clear()">Logout</a></li>
        </ul>
    </nav>

    <div class="container" style="padding: 20px;">
        <h2>All Blogs</h2>
        <div id="blogs-container" style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px;">
            <!-- Blogs yahan load honge -->
        </div>
    </div>

    <script>
        // 1. Security Check: Token na hone par login page par bhejo
        const token = localStorage.getItem('token');
        if (!token) {
            alert("Pehle Login karein!");
            window.location.href = 'login.html';
        }

        // 2. Database se blogs mangwana
        async function fetchBlogs() {
            try {
                const response = await fetch('/blogs');
                const blogs = await response.json();

                const blogsContainer = document.getElementById('blogs-container');
                blogsContainer.innerHTML = '';

                blogs.forEach(blog => {
                    const blogBox = document.createElement('div');
                    blogBox.style.border = "1px solid #ccc";
                    blogBox.style.padding = "15px";
                    blogBox.style.borderRadius = "5px";
                    blogBox.style.width = "300px";

                    blogBox.innerHTML = `
                        <h3>${blog.title}</h3>
                        <p>${blog.description.substring(0, 50)}...</p>
                        
                        <a href="blog-detail.html?id=${blog._id}" style="display: inline-block; margin-top: 10px; color: white; background: #3498db; padding: 5px 10px; text-decoration: none; border-radius: 3px;">Read More</a>
                        
                        <a href="edit-blog.html?id=${blog._id}" style="display: inline-block; margin-top: 10px; margin-left: 10px; color: white; background: #f39c12; padding: 5px 10px; text-decoration: none; border-radius: 3px;">Edit</a>

                        <button onclick="deleteBlog('${blog._id}')" style="display: inline-block; margin-top: 10px; margin-left: 10px; color: white; background: #e74c3c; padding: 6px 10px; border: none; border-radius: 3px; cursor: pointer;">Delete</button>
                    `;

                    blogsContainer.appendChild(blogBox);
                });
            } catch (error) {
                console.log("Error fetching blogs:", error);
            }
        }

        // 3. Blog delete karna
        async function deleteBlog(id) {
            const confirmDelete = confirm("Kya aap waqai is blog ko delete karna chahte hain?");
            if (confirmDelete) {
                try {
                    const response = await fetch(`/blog/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    alert(data.message);
                    fetchBlogs();
                } catch (error) {
                    alert("Delete karne mein error aa gaya!");
                }
            }
        }

        fetchBlogs();
    </script>
</body>

</html>
