<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - My Blog</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Thori si styling form ke liye */
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <h2 class="logo">My Blog</h2>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="create-blog.html">Create Blog</a></li>
            <li><a href="login.html">Logout</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Create a New Blog</h2>
        <form id="createBlogForm">
            <input type="text" id="title" placeholder="Blog Title" required>
            <textarea id="description" placeholder="Blog Description (Apne blog ke baare mein likhein)" rows="5"
                required></textarea>
            <input type="text" id="image" placeholder="Image URL (Tasveer ka link - Optional)">
            <button type="submit" class="btn">Publish Blog</button>
        </form>
    </div>

    <!-- Yeh JavaScript Backend API ko naya blog bheji gi -->
    <script>
        document.getElementById('createBlogForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const authorId = localStorage.getItem('userId'); // Logged-in user ki ID

            try {
                const response = await fetch('/create-blog', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, authorId })
                });

                const data = await response.json();
                alert(data.message);
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert("Blog create karne mein masla aaya!");
            }
        });
    </script>
</body>

</html>
